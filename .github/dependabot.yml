# Dependabot configuration for Astlide.
# - Security updates run automatically via the repository setting (no config needed)
# - Version updates are scoped here per ecosystem.

version: 2
updates:
  # GitHub Actions used in our workflows (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # One entry for the whole bun workspace (root, packages/*, playground, tools/*):
  # the "bun" ecosystem updates every workspace manifest together with bun.lock.
  # Per-directory entries are not needed and produced lockfile-less duplicate PRs.
  # No version is held back on purpose — adapt the code to new majors instead.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all minor/patch bumps so PR volume stays sane
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    exclude-paths:
      # Deliberately TypeScript 6: the JS compiler API bridge for tools that
      # don't support TypeScript 7 yet (see scripts/use-typescript6.mjs).
      - "tools/ts6"

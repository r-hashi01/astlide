# Dependabot configuration for Astlide.
# - Security updates run automatically via the repository setting (no config needed)
# - Version updates are scoped here per ecosystem.

version: 2
updates:
  # GitHub Actions used in our workflows (.github/workflows/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"

  # Root bun workspace — covers playground devDeps. The "bun" ecosystem keeps
  # bun.lock in sync (the "npm" ecosystem only bumped package.json).
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all minor/patch bumps so PR volume stays sane
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Astro is a peer dependency in @astlide/core; we test against a matrix
      # in CI rather than tracking a moving target via Dependabot.
      - dependency-name: "astro"
      # TypeScript 7 (native Go port) drops the JS compiler API that
      # @astrojs/language-server / `astro check` depend on. Revisit once
      # Astro tooling supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/packages/astlide"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "deps"
      - "@astlide/core"
    commit-message:
      prefix: "chore(deps,core)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "astro"

  - package-ecosystem: "bun"
    directory: "/packages/create-astlide"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "create-astlide"
    commit-message:
      prefix: "chore(deps,cli)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 (native Go port) drops the JS compiler API that
      # @astrojs/language-server / `astro check` depend on. Revisit once
      # Astro tooling supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/playground"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "deps"
      - "playground"
    commit-message:
      prefix: "chore(deps,playground)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "astro"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job: none of them writes to the repository.
permissions:
  contents: read

# Astro needs a system Node.js: Bun ships its own Node-compat runtime, but
# `bunx astro check` and `astro build` shell into `node` for child processes —
# so every job that runs Astro sets up Node next to Bun. The version is pinned
# in .node-version (a patched Node 22 release; raise it with Node security
# releases).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run test
      # The connect-time address check, under the runtime the exporter uses.
      - run: bun packages/astlide/tests/bun/public-request.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Sub-path deployments (Astro `base`, e.g. GitHub Pages): every internal
      # link must carry the base.
      - name: Build under a base path
        run: ASTLIDE_BASE=/astlide bun run build
      - run: node scripts/check-base-links.mjs playground/dist /astlide --trailing-slash
      - name: Build docs site
        run: bun run docs:build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      # Layout properties and keyboard flows in Chromium, on the built playground.
      - run: bun run test:e2e

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cd packages/create-astlide && bunx tsc

  astro-compat:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pin both the oldest 7.x minor we support and the latest available, so we catch
        # both regressions in old behaviour and breakages introduced upstream.
        astro: ["7.2.10", "7.3.7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Override Astro version
        run: |
          # Pin playground's astro to the matrix version and force it workspace-wide via
          # root `overrides`, so astro is hoisted together with its own transitive deps
          # (e.g. astro 7.0.x needs cookie@1 while 7.2+ needs cookie@2).
          node -e "
            const fs = require('node:fs');
            const edit = (p, fn) => {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              fn(pkg);
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            };
            edit('./playground/package.json', (pkg) => { pkg.dependencies.astro = '${{ matrix.astro }}'; });
            edit('./package.json', (pkg) => { pkg.overrides = { ...pkg.overrides, astro: '${{ matrix.astro }}' }; });
          "
          bun install --no-save
      - run: bun run test
      - run: bun run build

  # Single required status check for the Astro matrix. Branch rules require
  # "Astro Compat" instead of the per-version job names, so changing the matrix
  # versions doesn't require editing the ruleset.
  astro-compat-result:
    name: Astro Compat
    if: always()
    needs: astro-compat
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.astro-compat.result }}" = "success"

  # The render service's image builds, starts and renders PPTX and PDF
  # (built only — nothing is pushed).
  server-docker:
    name: Server Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f packages/server/Dockerfile -t astlide-server .
      - name: Refuses to start in the open without a key
        run: |
          if docker run --rm astlide-server; then echo "started without an API key"; exit 1; fi
      # Chromium keeps its sandbox (the default): the seccomp profile lets it
      # create the namespaces it needs, and the PDF below fails without them.
      - run: >-
          docker run -d --name astlide-server -p 8787:8787 -e ASTLIDE_API_KEY=ci-key
          --security-opt seccomp=packages/server/chromium-seccomp.json astlide-server
      - name: Render through the API
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8787/health && break; sleep 1; done
          curl -sf localhost:8787/openapi.json > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -d '{}' localhost:8787/render)" = 401
          for format in pptx pdf; do
            curl -sS --fail-with-body -o "out.$format" -H 'content-type: application/json' \
              -H 'authorization: Bearer ci-key' \
              -d "{\"markdown\":\"# こんにちは\\n---\\n# Two\",\"format\":\"$format\"}" \
              localhost:8787/render
            file "out.$format"
          done
          file out.pptx | grep -q -i "PowerPoint\|Zip"
          file out.pdf | grep -q PDF
      - name: Without the profile, PDF fails instead of running unsandboxed
        run: |
          docker run -d --name astlide-nosandbox -p 8788:8787 -e ASTLIDE_API_KEY=ci-key astlide-server
          for i in $(seq 1 30); do curl -sf localhost:8788/health && break; sleep 1; done
          code=$(curl -s -o nosandbox.json -w '%{http_code}' -H 'content-type: application/json' \
            -H 'authorization: Bearer ci-key' -d '{"markdown":"# One","format":"pdf"}' localhost:8788/render)
          cat nosandbox.json; echo
          test "$code" = 422
          grep -q "sandbox" nosandbox.json
      - if: failure()
        run: docker logs astlide-server

  template-smoke:
    name: Template Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: node scripts/test-template.mjs

  strict-install-smoke:
    name: Strict Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # System libraries for Chromium; each test project installs its own browser.
      - run: bunx playwright install-deps chromium
      # Astro, Next.js and Nuxt projects on the packed tarballs, installed the way pnpm does.
      - run: node scripts/test-strict-install.mjs

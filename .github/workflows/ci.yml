name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Astro 7 requires Node.js >=22.12. Bun ships its own Node-compat runtime,
# but `bunx astro check` and `astro build` shell into the system `node` for
# child processes — so every job that runs Astro needs setup-node@v4 with
# node-version: 22 alongside setup-bun.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Sub-path deployments (Astro `base`, e.g. GitHub Pages): every internal
      # link must carry the base.
      - name: Build under a base path
        run: ASTLIDE_BASE=/astlide bun run build
      - run: node scripts/check-base-links.mjs playground/dist /astlide
      - name: Build docs site
        run: bun run docs:build

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cd packages/create-astlide && bunx tsc

  astro-compat:
    name: Astro ${{ matrix.astro }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pin both the oldest 7.x minor we support and the latest available, so we catch
        # both regressions in old behaviour and breakages introduced upstream.
        astro: ["7.2.10", "7.3.7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Override Astro version
        run: |
          # Pin playground's astro to the matrix version and force it workspace-wide via
          # root `overrides`, so astro is hoisted together with its own transitive deps
          # (e.g. astro 7.0.x needs cookie@1 while 7.2+ needs cookie@2).
          node -e "
            const fs = require('node:fs');
            const edit = (p, fn) => {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              fn(pkg);
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            };
            edit('./playground/package.json', (pkg) => { pkg.dependencies.astro = '${{ matrix.astro }}'; });
            edit('./package.json', (pkg) => { pkg.overrides = { ...pkg.overrides, astro: '${{ matrix.astro }}' }; });
          "
          bun install --no-save
      - run: bun run test
      - run: bun run build

  # Single required status check for the Astro matrix. Branch rules require
  # "Astro Compat" instead of the per-version job names, so changing the matrix
  # versions doesn't require editing the ruleset.
  astro-compat-result:
    name: Astro Compat
    if: always()
    needs: astro-compat
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.astro-compat.result }}" = "success"

  template-smoke:
    name: Template Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: node scripts/test-template.mjs

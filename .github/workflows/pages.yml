name: Pages

# Publishes https://r-hashi01.github.io/astlide/:
#   /astlide/        docs site (Starlight, docs/)
#   /astlide/api/    TypeDoc API reference
#   /astlide/demo/   the playground deck, built under that base path

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build docs + API reference
        run: bun run docs:build
      - name: Build the demo deck under /astlide/demo
        run: ASTLIDE_BASE=/astlide/demo bun run build
      - run: node scripts/check-base-links.mjs playground/dist /astlide/demo
      - name: Assemble site
        run: cp -r playground/dist docs/dist/demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

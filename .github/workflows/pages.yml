name: Pages

# Publishes https://astlide.dev/:
#   /        docs site (Starlight, docs/)
#   /api/    TypeDoc API reference
#   /demo/   the playground deck, built under that base path
# (custom domain: set in the repository's Pages settings; DNS on Cloudflare)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The build runs third-party code (dependencies, Astro, TypeDoc), so it only
# reads; deploying to Pages is the deploy job's alone.
permissions:
  contents: read

# One deployment at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - name: Build docs + API reference
        run: bun run docs:build
      - name: Build the demo deck under /demo
        run: ASTLIDE_BASE=/demo bun run build
      - run: node scripts/check-base-links.mjs playground/dist /demo --trailing-slash
      - name: Assemble site
        run: cp -r playground/dist docs/dist/demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    permissions:
      pages: write
      id-token: write
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
